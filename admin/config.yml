backend:
  name: github
  repo: rizkisvip575/absensi-uhuy # Sudah disesuaikan dengan repositori Anda
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Judul Halaman", name: "title", widget: "string" }
          - { label: "Isi Konten", name: "body", widget: "markdown" }
